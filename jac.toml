[project]
name = "RAL"
version = "0.1.0"
description = "Visual platform for building and RL-optimizing multi-agent AI workflows"
entry-point = "main.jac"
kind = "web-app"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@xyflow/react" = "latest"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

# Client sv import auto-spawns endpoints as a microservice; LLM/RL steps need headroom.
[scale.microservices.services.endpoints]
rpc_timeout = 120.0

[byllm.model]
default_model = "gemini/gemini-2.5-flash"

[client]
